name: Check, Build and Test

on: [push, pull_request]

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt clang-format==20.1.0
      - name: Run format checker
        run: python3 build.py --build-type Debug --enable-format-check --donot-build-files

  build-linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-20-dev g++
          python3 -m pip install -r requirements.txt
      - name: Build and run compiler tests
        run: |
          ulimit -c 0
          python3 build.py --llvm-position /usr/lib/llvm-20 --build-type Debug --enable-tests --threads 2
      - name: Check editor diagnostics
        run: python3 vscode-lis/test-diagnostics.py Build/Binaries/lisls
      - name: Package and run the quick start
        run: |
          tar -czf lis-linux-x64.tar.gz LICENSE -C Build/Binaries lisc lisls lstdlib
          mkdir smoke
          tar -xzf lis-linux-x64.tar.gz -C smoke
          smoke/lisc Examples/print.lis --out smoke/print.o
          g++ smoke/print.o -o smoke/print
          smoke/print > smoke/output.txt
          grep -Fx 'hello world' smoke/output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lis-linux-x64
          path: lis-linux-x64.tar.gz
