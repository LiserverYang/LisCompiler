name: Check, Build and Test

on: [push, pull_request]

jobs:
  get-info:
    runs-on: ubuntu-24.04
    outputs:
      date: ${{ steps.vars.outputs.date }}
      shorthash: ${{ steps.vars.outputs.shorthash }}
      fullhash: ${{ steps.vars.outputs.fullhash }}
    steps:
      - uses: actions/checkout@v4
      - name: Get date and git hash
        id: vars
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "shorthash=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "fullhash=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "shorthash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "fullhash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # Build/ is a git submodule (LisBuilder)

      - name: Install python3
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pin clang-format 20.1.0: Ubuntu's apt ships clang-format 18, whose
      # output differs from the version the codebase is formatted with (20,
      # the LLVM the project builds against). Local and CI must agree.
      - name: Set up Clang-format (20.1.0)
        run: |
          python3 -m pip install --user clang-format==20.1.0
          echo "$(python3 -m site --user-base)/bin" >> $GITHUB_PATH

      - name: Install python modules
        run: python3 -m pip install -r requirements.txt

      - name: Run format checker
        run: python3 build.py --build-type Debug --enable-format-check --donot-build-files

